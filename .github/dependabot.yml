# Dependabot configuration.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # npm dependencies: the root (tooling) and the three workspaces, which share the root lockfile
  - package-ecosystem: "npm"
    directories:
      - "/" # Root package.json
      - "/echo_backend"
      - "/echo_frontend"
      - "/echo_utilities"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # eslint-plugin-react does not support ESLint 10 yet (context.getFilename removed): revisit once it does
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-jsdoc"
        update-types: ["version-update:semver-major"]
      # Runtime is Node 24: types must not get ahead of it
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # Base images of the Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # Odd-numbered Node releases never become LTS; only track even (LTS) majors
      - dependency-name: "node"
        versions: ["25", "27", "29", "31", "33", "35", "37", "39"]
    groups:
      docker-images:
        patterns:
          - "*"

  # GitHub Actions used in CI workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
