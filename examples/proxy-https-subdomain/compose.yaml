# Echo over HTTP, behind a reverse proxy serving it over HTTPS on a subdomain.
#
# URL: https://local.testing.cc/app

services:
  echo:
    image: ${ECHO_IMAGE:-ghcr.io/br0nie5/echo:latest}
    container_name: echo
    # Optional, in production too: without it, Node.js ignores the stop signal of Docker, which
    # waits 10 seconds before killing the container each time it is stopped or restarted.
    init: true
    environment:
      - SERVER_NAME=Echo Proxy HTTPS Subdomain
      # Authentication is enabled by default (true): uncomment to disable it.
      # - HAS_AUTHENTICATION=false
      # Disabled by default (false): enabled here, hence the /server_logs volume.
      - SAVE_SELF_REPORTS_TO_FILE=true
      # Telegram notifications: disabled unless the four are set.
      # - LOGS_NOTIFIER_SCHEDULE=*/30 * * * *
      # - LOGS_NOTIFIER_WATCHED_LOGS_LEVELS=ERROR,WARNING
      # - TELEGRAM_CHAT_ID=123456789
      # - TELEGRAM_BOT_TOKEN=<token>
      # When unset, every proxy is trusted. Uncomment to believe only the proxy of this file.
      # - TRUSTED_PROXIES=172.30.0.2
    volumes:
      # The directories of this repository: replace them with your own.
      - ../../test_logs:/watched_logs:ro
      - ../../server_logs:/server_logs
      - ../../data:/app/data
    networks:
      - echo
    restart: unless-stopped

  proxy:
    image: caddy:2
    container_name: echo-proxy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../certs:/certs:ro
    ports:
      - 80:80
      - 443:443
    networks:
      echo:
        # A fixed address, so TRUSTED_PROXIES can name it.
        ipv4_address: 172.30.0.2
    depends_on:
      - echo
    restart: unless-stopped

networks:
  echo:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # Docker picks the address of Echo in this half, so it never takes the one of the proxy.
          ip_range: 172.30.0.128/25
